name: Deploy to mydevil.net

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/kalk.antyramy.eu/public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/.env
            **/data/cennik.db
            **/data/*.zip
            **/stary/**
            **/.venv/**
            **/mockup-ui.html
