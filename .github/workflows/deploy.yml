name: Deploy to mydevil.net

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H s61.mydevil.net >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='stary/' \
            --exclude='.venv/' \
            --exclude='mockup-ui.html' \
            --exclude='.github/' \
            --exclude='static/' \
            ./ Pluszek@s61.mydevil.net:/home/Pluszek/domains/kalk.antyramy.eu/public_python/

      - name: Deploy static files
        run: |
          rsync -avz --delete \
            static/ \
            Pluszek@s61.mydevil.net:/home/Pluszek/domains/kalk.antyramy.eu/public_python/public/static/

      - name: Install dependencies & restart app
        run: |
          ssh Pluszek@s61.mydevil.net << 'EOF'
            source ~/.virtualenvs/kalk/bin/activate
            cd ~/domains/kalk.antyramy.eu/public_python
            pip install -r requirements.txt -q
            touch passenger_wsgi.py
          EOF
